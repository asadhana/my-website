name: Deploy the Wordpress site to Ubuntu Server

on:
  workflow_dispatch:
    inputs:
      deploy_path:
        description: 'Remote path to deploy to (overrides REMOTE_PATH secret)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.2
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add remote host to known_hosts
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          PORT=${{ secrets.REMOTE_PORT }}
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh-keyscan -p "$PORT" -H "${{ secrets.REMOTE_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync html/ to server using rsync over SSH
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          set -e
          PORT=${REMOTE_PORT:-22}
          TARGET_PATH="${{ github.event.inputs.deploy_path }}"
          if [ -z "$TARGET_PATH" ]; then TARGET_PATH="$REMOTE_PATH"; fi
          if [ -z "$TARGET_PATH" ]; then echo "REMOTE_PATH not set and no input provided; aborting." && exit 1; fi
          echo "Deploying html/ -> ${REMOTE_USER}@${REMOTE_HOST}:${TARGET_PATH} (port $PORT)"
          rsync -avz --delete --exclude='.git' --exclude='.github' --exclude='html/wp-config.php' -e "ssh -p $PORT" ./html/ ${REMOTE_USER}@${REMOTE_HOST}:"${TARGET_PATH}"
